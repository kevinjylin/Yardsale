<title id="title">Yardsale agent architecture</title><desc id="desc">Seven core Fetch.ai agents and one item agent per approved listing. The orchestrator coordinates identification, parallel sold-price research and live market scouting, appraisal, deal finding, and buyer-side negotiation. Item agents enforce a private seller floor. Checkout and Craigslist email negotiation are orchestrator functions.</desc>
