<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>How Yardsale's agents fit together</title>
  <desc>Buyers and sellers reach Yardsale through the ASI:One chat, @yardsale on Fetch Business, or Craigslist email. All three go to the Yardsale Orchestrator, which runs checkout and hands each job to an agent, sending each request through that agent's Agentverse mailbox: the Identifier, Researcher, Market Scout, and Appraiser price a photo, and the Deal Finder scores listings on other sites. An item agent per approved listing haggles with buyers. For a Craigslist post the buyer picks, the orchestrator's email negotiator haggles with the seller by email, never above the buyer's max.</desc>
  <defs>
    <style>
      /*THEME*/:root {
        --bg: #141414; --ink: #ECEAE4; --muted: #A29E96; --line: #8F8A82;
        --card: #1F1F1E; --card-stroke: #3A3936;
        --orch: #4A42C4; --orch-ink: #FFFFFF; --orch-sub: #DEDBFF; --orch-dash: #ABA5FF;
        --sell-bg: #15241C; --sell-stroke: #2B4A39; --sell: #5CC593;
        --haggle-bg: #271D10; --haggle-stroke: #57401F; --haggle: #F2A453;
        --buy-bg: #131C2B; --buy-stroke: #2B4063; --buy: #7BA4F0;
        --chip: #2D2C2A; --chip-ink: #C9C4BB; --badge-ink: #10140F;
        --av-bg: #24214D; --av-stroke: #6A63D9; --av-ink: #D2CEFF;
      }/*END*/
      text { font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .bg { fill: var(--bg); }
      .card { fill: var(--card); stroke: var(--card-stroke); stroke-width: 1.5; }
      .card-dash { fill: var(--card); stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .lane-sell { fill: var(--sell-bg); stroke: var(--sell-stroke); stroke-width: 1.5; }
      .lane-haggle { fill: var(--haggle-bg); stroke: var(--haggle-stroke); stroke-width: 1.5; }
      .lane-buy { fill: var(--buy-bg); stroke: var(--buy-stroke); stroke-width: 1.5; }
      .orch { fill: var(--orch); }
      .checkout { fill: rgba(255, 255, 255, 0.07); stroke: var(--orch-dash); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .legend-dash { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
      .wire { fill: none; stroke: var(--line); stroke-width: 2; }
      .arrowhead { fill: var(--line); }
      .chip { fill: var(--chip); }
      .chip-orch { fill: rgba(255, 255, 255, 0.16); }
      .chip-t { font-size: 13px; font-weight: 600; fill: var(--chip-ink); }
      .chip-orch-t { font-size: 13px; font-weight: 600; fill: var(--orch-ink); }
      .av { fill: var(--av-bg); stroke: var(--av-stroke); stroke-width: 1.5; }
      .av-t { font-size: 13px; font-weight: 600; fill: var(--av-ink); }
      .t-title { font-size: 21px; font-weight: 700; }
      .t-body { font-size: 16px; }
      .t-small { font-size: 14px; fill: var(--muted); }
      .o-title { font-size: 28px; font-weight: 700; fill: var(--orch-ink); }
      .o-handle { font-size: 16px; fill: var(--orch-sub); }
      .o-body { font-size: 16px; fill: var(--orch-sub); }
      .c-title { font-size: 20px; font-weight: 700; fill: var(--orch-ink); }
      .c-body { font-size: 15px; fill: var(--orch-sub); }
      .lane-t { font-size: 17px; font-weight: 700; }
      .sell-t { fill: var(--sell); }
      .haggle-t { fill: var(--haggle); }
      .buy-t { fill: var(--buy); }
      .lane-note { font-size: 14px; fill: var(--muted); }
      .name { font-size: 19px; font-weight: 700; }
      .handle { font-size: 13px; fill: var(--muted); }
      .desc { font-size: 15px; }
      .note { font-size: 13px; fill: var(--muted); }
      .badge-sell { fill: var(--sell); }
      .badge-t { font-size: 14px; font-weight: 700; fill: var(--badge-ink); }
      .wire-label { font-size: 14px; fill: var(--muted); }
      .legend { font-size: 14px; fill: var(--muted); }
      .foot { font-size: 15px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <!-- Where people come in -->
  <rect class="card" x="48" y="40" width="456" height="128" rx="14"/>
  <text class="t-title" x="72" y="76">ASI:One chat</text>
  <text class="t-body" x="72" y="102">Sellers send photos, buyers search</text>
  <text class="t-body" x="72" y="124">Every reply is a card with buttons</text>
  <text class="t-small" x="72" y="150">Agent Chat Protocol, through an Agentverse mailbox</text>

  <rect class="card" x="572" y="40" width="456" height="128" rx="14"/>
  <text class="t-title" x="596" y="76">@yardsale on Fetch Business</text>
  <text class="t-body" x="596" y="102">Buyers find deals, sellers check prices</text>
  <text class="t-body" x="596" y="124">Starts haggling with a Craigslist seller</text>
  <text class="t-small" x="596" y="150">Its OpenAPI tools call Yardsale's HTTP API</text>

  <rect class="card" x="1096" y="40" width="456" height="128" rx="14"/>
  <text class="t-title" x="1120" y="76">Craigslist email</text>
  <text class="t-body" x="1120" y="102">Buyers answer the seller's post</text>
  <text class="t-body" x="1120" y="124">Yardsale emails sellers for buyers</text>
  <text class="t-small" x="1120" y="150">Through Craigslist's relay, one Yardsale inbox</text>

  <path class="wire" d="M276 168 V190 H1324 V168"/>
  <path class="wire" d="M800 168 V213" marker-end="url(#arrow)"/>

  <!-- Orchestrator -->
  <rect class="orch" x="48" y="214" width="1504" height="124" rx="16"/>
  <text class="o-title" x="84" y="258">Yardsale Orchestrator</text>
  <text class="o-handle mono" x="84" y="287">@ys-orchestrator</text>
  <text class="o-body" x="84" y="317">Hands each job to an agent below · asi1-mini reads typed text · keeps state in SQLite</text>

  <rect class="checkout" x="1196" y="230" width="332" height="92" rx="12"/>
  <text class="c-title" x="1220" y="262">Checkout</text>
  <rect class="chip-orch" x="1380" y="244" width="132" height="24" rx="12"/>
  <text class="chip-orch-t" x="1446" y="261" text-anchor="middle">Stripe test mode</text>
  <text class="c-body" x="1220" y="288">A payment link for each deal</text>
  <text class="c-body" x="1220" y="310">5% commission · Payment Protocol</text>

  <!-- Orchestrator to each job; requests to the photo and deal agents go through Agentverse -->
  <path class="wire" d="M448 339 V407" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect class="av" x="386" y="360" width="124" height="26" rx="13"/>
  <text class="av-t" x="448" y="378" text-anchor="middle">via Agentverse</text>
  <text class="wire-label" x="370" y="369" text-anchor="end">Photo in,</text>
  <text class="wire-label" x="370" y="387" text-anchor="end">price out</text>

  <path class="wire" d="M1022 339 V407" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="wire-label" x="1006" y="369" text-anchor="end">Starts one on approval,</text>
  <text class="wire-label" x="1006" y="387" text-anchor="end">relays buyers' offers</text>

  <path class="wire" d="M1374 339 V407" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect class="av" x="1312" y="360" width="124" height="26" rx="13"/>
  <text class="av-t" x="1374" y="378" text-anchor="middle">via Agentverse</text>
  <text class="wire-label" x="1296" y="369" text-anchor="end">Search in,</text>
  <text class="wire-label" x="1296" y="387" text-anchor="end">scored deals out</text>

  <!-- Sell: price a photo -->
  <rect class="lane-sell" x="48" y="408" width="800" height="342" rx="18"/>
  <text class="lane-t sell-t" x="72" y="442">Sell: price a photo</text>
  <text class="lane-note" x="824" y="442" text-anchor="end">Step 1, then both 2s at once, then 3</text>

  <rect class="card" x="72" y="538" width="210" height="120" rx="12"/>
  <text class="name" x="90" y="572">Identifier</text>
  <rect class="chip" x="202" y="554" width="66" height="24" rx="12"/>
  <text class="chip-t" x="235" y="571" text-anchor="middle">Claude</text>
  <text class="handle mono" x="90" y="594">@ys-identifier</text>
  <text class="desc" x="90" y="620">What's in the photo:</text>
  <text class="desc" x="90" y="642">brand, model, condition</text>
  <circle class="badge-sell" cx="72" cy="538" r="14"/>
  <text class="badge-t" x="72" y="543" text-anchor="middle">1</text>

  <rect class="card" x="322" y="470" width="240" height="120" rx="12"/>
  <text class="name" x="340" y="504">Researcher</text>
  <rect class="chip" x="492" y="486" width="56" height="24" rx="12"/>
  <text class="chip-t" x="520" y="503" text-anchor="middle">Apify</text>
  <text class="handle mono" x="340" y="526">@ys-researcher</text>
  <text class="desc" x="340" y="552">What it sold for on eBay</text>
  <text class="desc" x="340" y="574">in the last 90 days</text>
  <circle class="badge-sell" cx="322" cy="470" r="14"/>
  <text class="badge-t" x="322" y="475" text-anchor="middle">2</text>

  <rect class="card" x="322" y="606" width="240" height="120" rx="12"/>
  <text class="name" x="340" y="640">Market Scout</text>
  <rect class="chip" x="492" y="622" width="56" height="24" rx="12"/>
  <text class="chip-t" x="520" y="639" text-anchor="middle">Apify</text>
  <text class="handle mono" x="340" y="662">@ys-scout</text>
  <text class="desc" x="340" y="688">What it's listed for now:</text>
  <text class="desc" x="340" y="710">Craigslist, OfferUp, FB, eBay</text>
  <circle class="badge-sell" cx="322" cy="606" r="14"/>
  <text class="badge-t" x="322" y="611" text-anchor="middle">2</text>

  <rect class="card" x="602" y="538" width="222" height="120" rx="12"/>
  <text class="name" x="620" y="572">Appraiser</text>
  <rect class="chip" x="744" y="554" width="66" height="24" rx="12"/>
  <text class="chip-t" x="777" y="571" text-anchor="middle">Claude</text>
  <text class="handle mono" x="620" y="594">@ys-appraiser</text>
  <text class="desc" x="620" y="620">Picks the sales that match</text>
  <text class="desc" x="620" y="642">Code sets price and floor</text>
  <circle class="badge-sell" cx="602" cy="538" r="14"/>
  <text class="badge-t" x="602" y="543" text-anchor="middle">3</text>

  <path class="wire" d="M282 598 H302 V530 H320" marker-end="url(#arrow)"/>
  <path class="wire" d="M302 598 V666 H320" marker-end="url(#arrow)"/>
  <path class="wire" d="M562 530 H582 V666 H562"/>
  <path class="wire" d="M582 598 H600" marker-end="url(#arrow)"/>

  <!-- Haggle: an agent per item -->
  <rect class="lane-haggle" x="872" y="408" width="300" height="342" rx="18"/>
  <text class="lane-t haggle-t" x="896" y="442">Haggle: an agent per item</text>

  <rect class="card" x="912" y="502" width="244" height="220" rx="12"/>
  <rect class="card" x="904" y="494" width="244" height="220" rx="12"/>
  <rect class="card" x="896" y="486" width="244" height="220" rx="12"/>
  <text class="name" x="914" y="520">Item agents</text>
  <text class="desc" x="914" y="548">One per approved listing</text>
  <text class="desc" x="914" y="574">Knows the seller's floor,</text>
  <text class="desc" x="914" y="596">never shows it</text>
  <text class="desc" x="914" y="622">Haggles with every buyer:</text>
  <text class="desc" x="914" y="644">ASI:One chat, Craigslist email</text>
  <text class="note" x="914" y="680">On Agentverse or in our server</text>

  <!-- Buy: find deals, negotiate -->
  <rect class="lane-buy" x="1196" y="408" width="356" height="342" rx="18"/>
  <text class="lane-t buy-t" x="1220" y="442">Buy: find deals, negotiate</text>

  <rect class="card" x="1220" y="460" width="308" height="138" rx="12"/>
  <text class="name" x="1238" y="492">Deal Finder</text>
  <rect class="chip" x="1458" y="474" width="56" height="24" rx="12"/>
  <text class="chip-t" x="1486" y="491" text-anchor="middle">Apify</text>
  <text class="handle mono" x="1238" y="513">@ys-dealfinder</text>
  <text class="desc" x="1238" y="538">Searches eBay, Craigslist, OfferUp, FB</text>
  <text class="desc" x="1238" y="560">Scores each against eBay sold prices</text>
  <text class="note" x="1238" y="583">Five best, each with a reason</text>

  <path class="wire" d="M1260 598 V627" marker-end="url(#arrow)"/>
  <text class="note" x="1274" y="617">Buyer picks a Craigslist post</text>

  <rect class="card-dash" x="1220" y="628" width="308" height="100" rx="12"/>
  <text class="name" x="1238" y="661">Email negotiator</text>
  <text class="desc" x="1238" y="687">Haggles with the Craigslist seller</text>
  <text class="desc" x="1238" y="709">by email, never above the buyer's max</text>

  <!-- Legend -->
  <rect class="card" x="48" y="790" width="34" height="24" rx="6"/>
  <text class="legend" x="94" y="807">Agent with its own address</text>
  <rect class="legend-dash" x="330" y="790" width="34" height="24" rx="6"/>
  <text class="legend" x="376" y="807">Part of the orchestrator, not its own agent</text>
  <rect class="chip" x="720" y="790" width="56" height="24" rx="12"/>
  <text class="chip-t" x="748" y="807" text-anchor="middle">Apify</text>
  <text class="legend" x="788" y="807">Outside service it calls</text>
  <rect class="av" x="990" y="789" width="124" height="26" rx="13"/>
  <text class="av-t" x="1052" y="807" text-anchor="middle">via Agentverse</text>
  <text class="legend" x="1126" y="807">Request goes to the agent's mailbox</text>
  <text class="foot" x="48" y="850">Claude reads photos. asi1-mini reads typed text. Suggested prices and deal scores come from code, not a model.</text>
</svg>
